# nginx.conf — StayKey
# Proxy reverso: Nginx → Gunicorn (porta 8000)

server {
    listen 80;
    server_name _;                  # Substitua pelo seu domínio em produção

    # Limite de upload (deve bater com MAX_CONTENT_LENGTH do Flask)
    client_max_body_size 5M;

    # Arquivos estáticos servidos diretamente pelo Nginx (muito mais rápido)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Todo o resto vai para o Gunicorn
    location / {
        proxy_pass         http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Buffer para evitar slow-loris
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # Oculta versão do Nginx
    server_tokens off;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
